<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Buddy - เพื่อนคุย & ครูสอนภาษา</title>
  <style>
    :root {
      --bg-color: #eef2f5;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text-main: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Sukhumvit Set', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    .header p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* กราฟิกตัวละครการ์ตูน */
    .avatar-wrapper {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      position: relative;
    }

    .avatar-bg {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #a5b4fc, #c084fc);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
    }

    .face {
      position: relative;
      width: 90px;
      height: 90px;
    }

    .eye {
      width: 14px;
      height: 14px;
      background: #1e1b4b;
      border-radius: 50%;
      position: absolute;
      top: 28px;
    }

    .eye.left { left: 16px; }
    .eye.right { right: 16px; }

    .mouth {
      width: 28px;
      height: 8px;
      background: #ef4444;
      border-radius: 0 0 14px 14px;
      position: absolute;
      bottom: 18px;
      left: 31px;
      transition: height 0.1s ease;
    }

    .talking .mouth {
      animation: talk 0.18s infinite alternate ease-in-out;
    }

    @keyframes talk {
      0% { height: 4px; border-radius: 4px; }
      100% { height: 20px; border-radius: 0 0 14px 14px; }
    }

    /* เมนูควบคุม และโหมด */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #f9fafb;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .btn-start {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }

    .btn-start:hover {
      background: var(--primary-hover);
    }

    /* กล่องข้อความและสถานะ */
    .status-text {
      font-size: 13px;
      color: #4b5563;
      font-weight: 500;
      min-height: 20px;
    }

    .chat-log {
      max-height: 140px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-log .user {
      color: #1e40af;
      font-weight: 500;
    }

    .chat-log .ai {
      color: #065f46;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="header">
    <h2>AI Companion 🤖</h2>
    <p>เพื่อนคุย & สอนภาษาแบบเปิดไมค์คุยได้เลย</p>
  </div>

  <div class="avatar-wrapper">
    <div class="avatar-bg" id="avatarBg">
      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth" id="mouth"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div>
      <label for="modeSelect">เลือกรูปแบบการคุย:</label>
      <select id="modeSelect">
        <option value="companion">🤝 เพื่อนคุยแก้เหงา (ภาษาไทย)</option>
        <option value="english_teacher">🇬🇧 ครูสอนภาษาอังกฤษ (พูดอังกฤษ + แก้ไวยากรณ์)</option>
        <option value="bilingual_chat">🌏 คุยสลับ 2 ภาษา (ไทย-อังกฤษ ชิลๆ)</option>
      </select>
    </div>

    <div>
      <label for="voiceSelect">เลือกเสียง AI:</label>
      <select id="voiceSelect"><option>กำลังโหลดเสียงในระบบ...</option></select>
    </div>

    <button class="btn-start" id="startBtn">▶️ เริ่มต้นพูดคุย (Hands-Free)</button>
  </div>

  <div class="status-text" id="status">พร้อมใช้งาน กดปุ่มด้านบนเพื่อเริ่มได้เลย</div>
  <div class="chat-log" id="chatLog"></div>
</div>

<script src="app.js"></script>
</body>
</html>
